{% extends "base.html" %}{% block title %}Đăng nhập quản trị{% endblock %}{% block content %}
<div class="card" style="max-width:420px;margin:70px auto"><h2>Đăng nhập quản trị</h2>{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><p><label>Tài khoản<br><input name="username" required autofocus style="width:100%"></label></p><p><label>Mật khẩu<br><input type="password" name="password" required style="width:100%"></label></p><button>Đăng nhập</button></form></div>
{% endblock %}
