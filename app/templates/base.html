<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}LicenseServer{% endblock %}</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f5f7fa;color:#1f2937;margin:0}header{background:#172554;color:white;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1280px;margin:20px auto;padding:0 18px}.card{background:white;border:1px solid #dbe2ea;border-radius:8px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.stat{font-size:25px;font-weight:700}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;vertical-align:top}input,select,textarea,button{font:inherit;padding:7px;border:1px solid #cbd5e1;border-radius:5px}select{min-width:220px;background:white}textarea{width:100%;box-sizing:border-box}button,.button{background:#1d4ed8;color:white;border:0;cursor:pointer;text-decoration:none;display:inline-block;padding:8px 12px;border-radius:5px}.danger{background:#b91c1c}.warn{background:#b45309}.secondary{background:#475569}.key{background:#ecfccb;border:1px solid #84cc16;padding:14px;font-family:Consolas,monospace;word-break:break-all}.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.muted{color:#64748b;font-size:13px}.notice{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:10px;border-radius:6px}.error{background:#fee2e2;color:#991b1b;padding:10px}.badge{padding:3px 7px;border-radius:12px;background:#e2e8f0}form.inline{display:inline}</style></head>
<body><header><strong>AutoTool LicenseServer</strong>{% if admin_id %}<form method="post" action="/admin/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary">Đăng xuất</button></form>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
